# docker-compose.yml — środowisko dev (hot reload, porty wystawione).
# Wersja produkcyjna: `docker-compose.prod.yml` (Caddy, brak wystawionych
# portów poza 80/443, migracje przed startem API).
#
# Zakres: postgres, redis, api, worker, frontend.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Dockerfile jest wielostopniowy (etap 7) — bez `target` zbudowałby
      # się stopień OSTATNI, czyli `prod`, i dev po cichu straciłby hot
      # reload oraz narzędzia z `requirements-dev` (ruff/mypy/pytest,
      # których używa `make check`).
      target: dev
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    command: ["python", "-m", "worker.scheduler"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      # Osiągalny z PRZEGLĄDARKI (fetch leci z klienta) — `localhost:8000`,
      # nie `http://api:8000` (to działa tylko server-to-server w compose).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
