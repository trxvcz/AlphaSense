name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: portfel, POSTGRES_PASSWORD: portfel, POSTGRES_DB: portfel_test }
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff format --check backend
      - run: ruff check backend
      - run: cd backend && mypy app
      - name: Migracje
        run: cd backend && alembic upgrade head
        env: { DATABASE_URL: 'postgresql+asyncpg://portfel:portfel@localhost:5432/portfel_test' }
      # `markets` to słownik referencyjny (ADR-102), nie dane testowe: `assets`
      # ma FK na `market_code`, więc bez tego kroku KAŻDY test tworzący aktywo
      # kończy się `ForeignKeyViolation` — łącznie z całą bramką izolacji.
      # Dev dostaje słownik przez `make seed`, produkcja przez `make prod-seed`;
      # CI nie miał go wcale i dlatego `make check` świecił zielono lokalnie
      # (pytest w kontenerze `api` uderza w zasianą bazę dev), a CI czerwono.
      - name: Seed słownika rynków
        run: cd backend && python -m app.cli seed --reference-only
        env:
          DATABASE_URL: 'postgresql+asyncpg://portfel:portfel@localhost:5432/portfel_test'
          REDIS_URL: 'redis://localhost:6379/0'
      - name: Testy
        run: cd backend && pytest -q -m "not network"
        env:
          DATABASE_URL: 'postgresql+asyncpg://portfel:portfel@localhost:5432/portfel_test'
          REDIS_URL: 'redis://localhost:6379/0'
      - name: Test izolacji dwóch użytkowników (bramka bezpieczeństwa)
        run: cd backend && pytest -q tests/test_isolation.py
        env:
          DATABASE_URL: 'postgresql+asyncpg://portfel:portfel@localhost:5432/portfel_test'
          REDIS_URL: 'redis://localhost:6379/0'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npx tsc --noEmit
      - name: Testy jednostkowe (Vitest)
        run: cd frontend && npm run test
      - run: cd frontend && npm run build

  # Obrazy produkcyjne (krok 36) budują się INACZEJ niż deweloperskie i mają
  # własne pułapki, których żadna analiza statyczna nie widzi — stopień `prod`
  # frontendu wywalał się kiedyś na `useradd --uid 1000` (konto `node` w obrazie
  # bazowym już zajmuje ten UID) i wyszło to dopiero przy realnym `docker build`.
  # Ten job jest po to, żeby taki błąd nie wjechał na `main` niezauważony.
  obrazy-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `frontend/public/` jest w repo puste, a git nie śledzi pustych katalogów
      # — świeży `checkout` to dokładnie ten stan, w którym Dockerfile musi
      # sobie poradzić (`RUN mkdir -p public` w stopniu `build`).
      - name: Backend (target prod)
        run: docker build --target prod -t alphasense-api:ci backend
      - name: Frontend (target prod)
        run: docker build --target prod -t alphasense-frontend:ci frontend

  # CD uruchamia się wyłącznie po zielonym pushu do `main` (ADR-103). Sekrety
  # i `.env.prod` pozostają na VPS-ie; GitHub Actions dostaje wyłącznie klucz
  # do konta wdrożeniowego. Wdrażamy SHA zdarzenia, a nie „to, co akurat jest
  # na `main`" — ma pójść dokładnie ten commit, który sprawdziły trzy joby CI.
  #
  # Ten job NIE zawiera procedury wdrożenia i nie może jej zawierać: klucz na
  # VPS-ie jest wpisany z `command="…/infra/deploy.sh"`, więc cokolwiek by tu
  # nie napisać, serwer uruchomi swój skrypt i potraktuje treść polecenia jako
  # jeden argument. Co się dzieje na produkcji, decyduje `infra/deploy.sh`
  # z zacommitowanego repo, nie ten plik. Konfiguracja klucza:
  # `docs/wdrozenie.md` §11.
  deploy:
    name: Wdrożenie na produkcję
    needs: [backend, frontend, obrazy-prod]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Job nie robi `checkout` i nie woła API GitHuba — nie ma powodu, żeby
    # `GITHUB_TOKEN` w tym środowisku cokolwiek mógł.
    permissions: {}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment: production
    # Zawieszony `ssh` (padnięta sieć VPS-a w trakcie `prod-build`) trzymałby
    # grupę `production-deploy` przez domyślne 6 godzin, blokując wszystkie
    # kolejne wdrożenia.
    timeout-minutes: 30
    # Dopóki wdrożenie nie jest skonfigurowane do końca, `ssh` świeci na
    # czerwono przy każdym pushu na `main` — a czerwony pipeline, który nie
    # znaczy „coś jest zepsute", uczy ignorowania czerwonego pipeline'u.
    # Warunek siedzi na KROKACH, nie na jobie, bo kontekst `secrets` nie jest
    # dostępny w `jobs.<id>.if` (jest w `jobs.<id>.env`).
    #
    # Sprawdzane są OBA sekrety pisane przez krok „Konfiguracja SSH": sam klucz
    # nie wystarczy, bo `StrictHostKeyChecking=yes` bez `known_hosts` kończy się
    # `Host key verification failed` (kod 255) — dokładnie to zdarzyło się
    # w przebiegu 31114724201, gdy warunek pilnował tylko klucza.
    # `SSH_HOST`/`SSH_PORT`/`SSH_USER` nie są tu sprawdzane osobno: ustawia się
    # je razem z kluczem i bez nich `ssh` i tak nie ma dokąd pójść.
    env:
      DEPLOY_CONFIGURED: ${{ secrets.SSH_PRIVATE_KEY_ALPHASENSE != '' && secrets.SSH_KNOWN_HOSTS != '' }}
    steps:
      - name: Wdrożenie nieskonfigurowane — pomijam
        if: env.DEPLOY_CONFIGURED != 'true'
        run: |
          echo "::notice::Brakuje sekretu SSH_PRIVATE_KEY_ALPHASENSE lub SSH_KNOWN_HOSTS — wdrożenie pominięte, produkcja bez zmian. known_hosts generuje się przez 'ssh-keyscan -p <port> <host>'. Procedura: docs/wdrozenie.md §11."

      - name: Konfiguracja SSH
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_ALPHASENSE }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # `umask 077` przed zapisem, nie `chmod` po: klucz nie ma istnieć
          # nawet przez chwilę z prawami do odczytu dla innych.
          (umask 077; printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519)
          (umask 077; printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts)

      - name: Wdrożenie zatwierdzonego commita
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_LOGIN: ${{ secrets.SSH_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/id_ed25519 \
            "$SSH_LOGIN@$SSH_HOST" "$DEPLOY_SHA"

      # Osobny krok, bo sprawdza co INNEGO niż healthcheck w `deploy.sh`: tam
      # kontener `api` widzi bazę, tutaj cała droga z internetu — DNS, TLS,
      # Caddy, proxy na `/api/*`. Świadomie NIE `curl --fail`: `/api/health`
      # z założenia zawsze oddaje `200`, a o stanie mówi ciało (krok 37), więc
      # kod HTTP przeszedłby także przy `db: down` i zielony job znaczyłby
      # dokładnie tyle, co „serwer odpowiada".
      - name: Sprawdzenie z zewnątrz
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          BASE_URL: https://alphasense.cedron.net.pl
        run: |
          for attempt in $(seq 1 10); do
            body=$(curl --silent --show-error --max-time 10 "$BASE_URL/api/health" || true)
            if printf '%s' "$body" | jq -e '.status == "ok" and .db == "up"' >/dev/null 2>&1; then
              echo "Produkcja odpowiada: $body"
              exit 0
            fi
            echo "Próba $attempt/10 — odpowiedź: ${body:-brak}"
            sleep 10
          done
          echo "::error::/api/health nie potwierdził stanu ok/db=up po 10 próbach"
          exit 1
