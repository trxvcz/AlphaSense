name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: portfel, POSTGRES_PASSWORD: portfel, POSTGRES_DB: portfel_test }
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff format --check backend
      - run: ruff check backend
      - run: cd backend && mypy app
      - name: Migracje
        run: cd backend && alembic upgrade head
        env: { DATABASE_URL: 'postgresql+asyncpg://portfel:portfel@localhost:5432/portfel_test' }
      - name: Testy
        run: cd backend && pytest -q -m "not network"
        env:
          DATABASE_URL: 'postgresql+asyncpg://portfel:portfel@localhost:5432/portfel_test'
          REDIS_URL: 'redis://localhost:6379/0'
      - name: Test izolacji dwóch użytkowników (bramka bezpieczeństwa)
        run: cd backend && pytest -q tests/test_isolation.py
        env:
          DATABASE_URL: 'postgresql+asyncpg://portfel:portfel@localhost:5432/portfel_test'
          REDIS_URL: 'redis://localhost:6379/0'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npx tsc --noEmit
      - name: Testy jednostkowe (Vitest)
        run: cd frontend && npm run test
      - run: cd frontend && npm run build

  # Obrazy produkcyjne (krok 36) budują się INACZEJ niż deweloperskie i mają
  # własne pułapki, których żadna analiza statyczna nie widzi — stopień `prod`
  # frontendu wywalał się kiedyś na `useradd --uid 1000` (konto `node` w obrazie
  # bazowym już zajmuje ten UID) i wyszło to dopiero przy realnym `docker build`.
  # Ten job jest po to, żeby taki błąd nie wjechał na `main` niezauważony.
  obrazy-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `frontend/public/` jest w repo puste, a git nie śledzi pustych katalogów
      # — świeży `checkout` to dokładnie ten stan, w którym Dockerfile musi
      # sobie poradzić (`RUN mkdir -p public` w stopniu `build`).
      - name: Backend (target prod)
        run: docker build --target prod -t alphasense-api:ci backend
      - name: Frontend (target prod)
        run: docker build --target prod -t alphasense-frontend:ci frontend
