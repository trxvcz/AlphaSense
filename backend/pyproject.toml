[project]
name = "portfel-backend"
version = "0.1.0"
description = "AlphaSense — backend FastAPI"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "worker"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "ASYNC",# async pitfalls (blocking I/O w handlerach)
    "N",    # pep8-naming
    "C4",   # comprehensions
]
ignore = [
    "E501", # długość linii pilnowana przez formatter
]

[tool.ruff.lint.isort]
known-first-party = ["app", "worker"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# `worker/` (plan krok 23) dzieli obraz Dockera z `app/` (docker-compose,
# inny `command:`) i podlega tym samym regułom strict — dopisane obok `app`
# zamiast osobnej sekcji, bo to jedna baza kodu backendu, nie osobny pakiet.
files = ["app", "worker"]

# Authlib nie publikuje py.typed/stuby (stan na 1.7.2) — bez tego mypy strict
# odmawia analizy modułu w ogóle (import-untyped). Klienta OAuth trzymamy za
# jedną granicą (`app/modules/auth/oauth.py`), więc utrata typowania jest
# lokalna, nie rozlewa się po resztcie `app/modules/auth`.
[[tool.mypy.overrides]]
module = "authlib.*"
ignore_missing_imports = true

# yfinance nie publikuje py.typed/stuby (stan na 1.5.2) — bez tego mypy strict
# odmawia analizy modułu w ogóle (import-untyped), tak samo jak przy Authlib
# wyżej. Klienta trzymamy za jedną granicą
# (`app/modules/marketdata/providers/yfinance.py`).
[[tool.mypy.overrides]]
module = "yfinance.*"
ignore_missing_imports = true

# APScheduler (3.11.x) nie publikuje py.typed/stuby — tak samo jak Authlib/
# yfinance wyżej. Granica ograniczona do `worker/scheduler.py` (jedyne
# miejsce, które go importuje).
[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Jedna pętla zdarzeń na całą sesję testów — silnik SQLAlchemy/asyncpg
# (`app.db.session.engine`) jest tworzony raz przy imporcie modułu i wiąże
# pierwsze połączenie z pętlą, w której zostało otwarte; osobna pętla per
# test (domyślne zachowanie pytest-asyncio) powoduje
# "Future attached to a different loop" z asyncpg.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    # Testy dymne na realne API dostawców (NBP, Stooq, yfinance, ...) —
    # wyłączone z CI (`ci.yml`: `pytest -q -m "not network"`), uruchamiane
    # tylko ręcznie/lokalnie (SKILL `data-provider`, sekcja „Testy").
    "network: testy wymagające prawdziwego dostępu do sieci",
]
