[project]
name = "portfel-backend"
version = "0.1.0"
description = "AlphaSense — backend FastAPI"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "ASYNC",# async pitfalls (blocking I/O w handlerach)
    "N",    # pep8-naming
    "C4",   # comprehensions
]
ignore = [
    "E501", # długość linii pilnowana przez formatter
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
